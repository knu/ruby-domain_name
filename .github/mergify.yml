extends: .github

queue_rules:
  - name: dependency-updates
    queue_conditions:
      - base = master
      - author ~= ^(dependabot|renovate)\[bot\]$
      - label != dependencies:major
      - -draft
      - -conflict
      - "#approved-reviews-by >= 1"
      - check-success = Test
    merge_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = Test

merge_protections_settings:
  auto_merge_conditions:
    - base = master
    - author ~= ^(dependabot|renovate)\[bot\]$
    - label != dependencies:major
    - -draft
    - -conflict
    - "#approved-reviews-by >= 1"
    - check-success = Test
