name: Publish gem to RubyGems.org

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  detect-release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'master' ||
         startsWith(github.event.workflow_run.head_branch, 'v')) &&
        github.repository == 'knu/ruby-domain_name'
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      release-kind: ${{ steps.release.outputs.kind }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Detect release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == v* ]]; then
            echo "kind=tag" >> "$GITHUB_OUTPUT"
            exit
          fi

          count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(
              .merged_at != null and
              .base.ref == "master" and
              .head.ref == "automation/public-suffix-list" and
              .head.repo.full_name == "knu/ruby-domain_name"
            )] | length')"
          if [[ "$count" == 1 ]]; then
            echo "kind=etld" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect-release
    if: >-
      ${{
        needs.detect-release.outputs.release-kind == 'tag' ||
        needs.detect-release.outputs.release-kind == 'etld'
      }}
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      deployment: false

    permissions:
      contents: write
      deployments: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Check out release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine release tag
        id: release
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_KIND: ${{ needs.detect-release.outputs.release-kind }}
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -e 'require "domain_name/version"; print DomainName::VERSION')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_KIND" == tag ]]; then
            test "v${version}" = "$HEAD_BRANCH"
            tag="$HEAD_BRANCH"
          else
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_KIND: ${{ needs.detect-release.outputs.release-kind }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if tag_sha="$(git rev-parse --verify "${TAG}^{commit}" 2>/dev/null)"; then
            test "$tag_sha" = "$HEAD_SHA"
          else
            test "$RELEASE_KIND" = etld
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field "ref=refs/tags/${TAG}" \
              --raw-field "sha=${HEAD_SHA}"
            git tag "$TAG" "$HEAD_SHA"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.334.0
        with:
          ruby-version: ruby

      - name: Install dependencies
        run: |
          bundle install --jobs 4 --retry 3

      - name: Verify release tag
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "${TAG}^{commit}")" = "$EXPECTED_SHA"
          version="$(ruby -Ilib -e 'require "domain_name/version"; print DomainName::VERSION')"
          test "v${version}" = "$TAG"

      # workflow_run uses the default branch SHA, so record the release tag explicitly.
      - name: Record deployment start
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" \
            --raw-field "ref=$TAG" \
            --raw-field environment=rubygems.org \
            --raw-field "description=Publish domain_name $VERSION" \
            --field auto_merge=false \
            --field 'required_contexts[]' \
            --field production_environment=true \
            --jq '.id')"
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --raw-field state=in_progress \
            --raw-field "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --field auto_inactive=false > /dev/null

      - name: Publish to RubyGems
        id: publish
        uses: rubygems/release-gem@v1.4.1

      - name: Record deployment result
        if: ${{ always() && steps.deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          case "$PUBLISH_OUTCOME" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            --raw-field "state=$state" \
            --raw-field "description=RubyGems publish: $PUBLISH_OUTCOME" \
            --raw-field "environment_url=https://rubygems.org/gems/domain_name/versions/${VERSION}" \
            --raw-field "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --field auto_inactive=false > /dev/null

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --generate-notes
