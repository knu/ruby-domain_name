name: Publish gem to RubyGems.org

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  detect-release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_branch == 'master' ||
         startsWith(github.event.workflow_run.head_branch, 'v')) &&
        github.repository == 'knu/ruby-domain_name'
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      release-kind: ${{ steps.release.outputs.kind }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Detect release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == v* ]]; then
            echo "kind=tag" >> "$GITHUB_OUTPUT"
            exit
          fi

          count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(
              .merged_at != null and
              .base.ref == "master" and
              .head.ref == "automation/public-suffix-list" and
              .head.repo.full_name == "knu/ruby-domain_name"
            )] | length')"
          if [[ "$count" == 1 ]]; then
            echo "kind=etld" >> "$GITHUB_OUTPUT"
          fi

  prepare-release:
    needs: detect-release
    if: >-
      ${{
        needs.detect-release.outputs.release-kind == 'tag' ||
        needs.detect-release.outputs.release-kind == 'etld'
      }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine release tag
        id: release
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_KIND: ${{ needs.detect-release.outputs.release-kind }}
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -e 'require "domain_name/version"; print DomainName::VERSION')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_KIND" == tag ]]; then
            test "v${version}" = "$HEAD_BRANCH"
            tag="$HEAD_BRANCH"
          else
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: ruby

      - name: Verify release tag
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_KIND: ${{ needs.detect-release.outputs.release-kind }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if tag_sha="$(git rev-parse --verify "${TAG}^{commit}" 2>/dev/null)"; then
            test "$tag_sha" = "$EXPECTED_SHA"
          else
            test "$RELEASE_KIND" = etld
          fi
          version="$(ruby -Ilib -e 'require "domain_name/version"; print DomainName::VERSION')"
          test "v${version}" = "$TAG"

      - name: Build gem
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          gem build domain_name.gemspec --output "pkg/domain_name-${TAG#v}.gem"

      - name: Upload gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-gem
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 1

  ensure-tag:
    needs:
      - detect-release
      - prepare-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Ensure release tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_KIND: ${{ needs.detect-release.outputs.release-kind }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          if tag_sha="$(git rev-parse --verify "${TAG}^{commit}" 2>/dev/null)"; then
            test "$tag_sha" = "$HEAD_SHA"
          else
            test "$RELEASE_KIND" = etld
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field "ref=refs/tags/${TAG}" \
              --raw-field "sha=${HEAD_SHA}"
          fi

  publish:
    needs:
      - prepare-release
      - ensure-tag
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/domain_name

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: ruby

      - name: Download gem artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-gem
          path: pkg

      - name: Check out release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rubygems/release-gem
          ref: 7f9650160c1a4e7989fdc9855807bdbd421d8b6b  # v1.4.1
          path: .release-gem
          persist-credentials: false

      - name: Configure trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a  # v2.1.0

      - name: Publish to RubyGems
        env:
          RUBYOPT: -r${{ github.workspace }}/.release-gem/rubygems-attestation-patch.rb
        run: |
          set -euo pipefail
          gem push pkg/*.gem

  await-release:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: ruby

      - name: Download gem artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-gem
          path: pkg

      - name: Wait for release to propagate
        run: |
          gem exec rubygems-await pkg/*.gem

  create-github-release:
    needs:
      - prepare-release
      - await-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --generate-notes
